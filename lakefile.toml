name = "lean_dft"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DFT"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Physlib (leanprover-community/physlib) at its release tag; Mathlib v4.36.0 is inherited from it.
[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib.git"
rev = "v4.36.0"

[[lean_lib]]
name = "DFT"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
