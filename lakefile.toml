name = "lean_dft"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ForMathlib", "QM", "DFT"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Physlib (leanprover-community/physlib) at its release tag; Mathlib v4.36.0 is inherited from it.
[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib.git"
rev = "v4.36.0"

# Libraries, strictly layered (scripts/check_layers.py): ForMathlib <- QM <- DFT.
# ForMathlib: pure mathematics (Mathlib candidates). QM: generic quantum mechanics and many-body theory
# (Physlib candidates). DFT: density-functional theory proper.
[[lean_lib]]
name = "ForMathlib"

[[lean_lib]]
name = "QM"

[[lean_lib]]
name = "DFT"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
